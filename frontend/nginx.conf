server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Built files have a hash in their name and never change: cache them long.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Every other path is a page of the app (React Router), e.g. /partners or /auth/callback.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
