name: bizpartnercheck

# Settings shared by the backend and the worker: both run checks against the sources,
# so both must use the same adapters, URLs and time limits. Empty means the default.
x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
  # Check runs go into the Redis queue; the worker executes them (S5.1).
  CELERY_BROKER_URL: redis://redis:6379/0
  # Fake sources for staging (fake-ok, fake-finding, fake-timeout, fake-malformed); empty = real.
  VIES_ADAPTER: ${VIES_ADAPTER:-}
  BMF_ADAPTER: ${BMF_ADAPTER:-}
  HFU_ADAPTER: ${HFU_ADAPTER:-}
  FIRMENBUCH_ADAPTER: ${FIRMENBUCH_ADAPTER:-}
  GISA_ADAPTER: ${GISA_ADAPTER:-}
  VIES_BASE_URL: ${VIES_BASE_URL:-}
  HFU_BASE_URL: ${HFU_BASE_URL:-}
  # Secret token from JustizOnline (docs/firmenbuch.md); empty = no Firmenbuch in runs.
  FIRMENBUCH_API_KEY: ${FIRMENBUCH_API_KEY:-}
  FIRMENBUCH_BASE_URL: ${FIRMENBUCH_BASE_URL:-}
  # Personal key from gisa.gv.at (docs/gisa.md); empty = no GISA in runs.
  GISA_API_KEY: ${GISA_API_KEY:-}
  GISA_BASE_URL: ${GISA_BASE_URL:-}
  SOURCE_TIMEOUT_SECONDS: ${SOURCE_TIMEOUT_SECONDS:-8}
  SOURCE_MAX_RETRIES: ${SOURCE_MAX_RETRIES:-2}
  SOURCE_DEADLINE_SECONDS: ${SOURCE_DEADLINE_SECONDS:-30}
  CHECK_RUN_DEADLINE_SECONDS: ${CHECK_RUN_DEADLINE_SECONDS:-30}
  CHECK_RUN_STALE_SECONDS: ${CHECK_RUN_STALE_SECONDS:-120}

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10


  backend:
    image: ghcr.io/team-6-se/bizpartnercheck-backend:staging
    restart: unless-stopped
    command: ["sh", "-c", "uv run --no-sync alembic upgrade head && uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      <<: *backend-env
      OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:?Set OIDC_JWKS_URL}
      OIDC_AUDIENCE: bizpartnercheck-api
      # Security log and registration: the realm reads the same secrets (see keycloak below).
      KEYCLOAK_API_CLIENT_SECRET: ${KEYCLOAK_API_CLIENT_SECRET:?Set KEYCLOAK_API_CLIENT_SECRET}
      KEYCLOAK_REGISTRATION_CLIENT_SECRET: ${KEYCLOAK_REGISTRATION_CLIENT_SECRET:?Set KEYCLOAK_REGISTRATION_CLIENT_SECRET}
      APP_BASE_URL: https://${DOMAIN:?Set DOMAIN}
      # Only Caddy reaches the backend: trust its X-Forwarded-For, so the registration
      # rate limit sees the visitor's address and not Caddy's.
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "8000"

  # Executes check runs from the queue (S5.1). Same image as the backend; more workers:
  # docker compose up -d --scale worker=2
  worker:
    image: ghcr.io/team-6-se/bizpartnercheck-backend:staging
    restart: unless-stopped
    command: ["uv", "run", "--no-sync", "celery", "-A", "app.worker", "worker", "--loglevel=info", "--concurrency=4"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Queue for check runs. No port to the outside; only backend and worker use it.
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  frontend:
    image: ghcr.io/team-6-se/bizpartnercheck-frontend:staging
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
      AUTH_DOMAIN: ${AUTH_DOMAIN:?Set AUTH_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
      - keycloak




  keycloak_db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
      POSTGRES_DB: keycloak
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10


  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start", "--import-realm"]
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?Set KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: https://${AUTH_DOMAIN:?Set AUTH_DOMAIN}
      # Filled into the realm file on the first start (placeholders ${...} in the JSON).
      APP_BASE_URL: https://${DOMAIN:?Set DOMAIN}
      KEYCLOAK_API_CLIENT_SECRET: ${KEYCLOAK_API_CLIENT_SECRET:?Set KEYCLOAK_API_CLIENT_SECRET}
      KEYCLOAK_REGISTRATION_CLIENT_SECRET: ${KEYCLOAK_REGISTRATION_CLIENT_SECRET:?Set KEYCLOAK_REGISTRATION_CLIENT_SECRET}
      # E-mails (registration, password reset): a real mail server on staging.
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
      - ./keycloak/themes/bizpartnercheck:/opt/keycloak/themes/bizpartnercheck:ro
    depends_on:
      keycloak_db:
        condition: service_healthy
    expose:
      - "8080"


volumes:
  db_data:
  caddy_data:
  caddy_config:
  keycloak_db_data: