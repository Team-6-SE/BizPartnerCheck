# BizPartnerCheck look for the Keycloak sign-in pages (sign in, forgot password, new password, …).
# CSS on top of Keycloak's default theme, plus one small script (one-time codes with a space).
# All pages and their logic stay Keycloak's own.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/bizpartnercheck.css
stylesCommon=vendor/patternfly-v5/patternfly.min.css vendor/patternfly-v5/patternfly-addons.css

scripts=js/otp-input.js

darkMode=true
