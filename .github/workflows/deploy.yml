
name: Deploy to Staging

# Manual start only until the staging server and its secrets exist.
# Later: add "push: branches: [main]" again for automatic deploys.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/team-6-se/bizpartnercheck-backend:staging
            ghcr.io/team-6-se/bizpartnercheck-backend:${{ github.sha }}
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/team-6-se/bizpartnercheck-frontend:staging
            ghcr.io/team-6-se/bizpartnercheck-frontend:${{ github.sha }}
          # Repository variable AUTH_DOMAIN (Settings → Secrets and variables → Actions → Variables).
          build-args: |
            VITE_OIDC_AUTHORITY=https://${{ vars.AUTH_DOMAIN }}/realms/bizpartnercheck

  deploy:
    name: Deploy to staging server
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          fingerprint: ${{ secrets.STAGING_SSH_FINGERPRINT }}
          script: |
            set -e
            cd /opt/bizpartnercheck
            docker compose --env-file deploy.env -f compose.deploy.yml pull
            docker compose --env-file deploy.env -f compose.deploy.yml up -d
