name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (lint, tests, coverage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bizpartner
          POSTGRES_PASSWORD: bizpartner
          POSTGRES_DB: bizpartner
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://bizpartner:bizpartner@localhost:5432/bizpartner
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked
      - name: Lint (Ruff)
        run: uv run ruff check . --output-format=github
      - run: uv run alembic upgrade head
      - name: Tests with coverage
        run: uv run pytest --cov --cov-report=term
      - name: Coverage summary
        # Shows the coverage table on the run's summary page of every PR.
        if: always()
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"