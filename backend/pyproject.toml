[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "httpx2>=2.16.0",
    "psycopg[binary]>=3.3.6",
    "pyjwt[crypto]>=2.15.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
# Migrations are generated by Alembic; they are not linted.
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
# Pyflakes (F) and pycodestyle errors (E4, E7, E9): real mistakes such as unused
# imports, undefined names or a bare "except". Style-only rules are left out on purpose.
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Story S1.2: the pipeline fails if test coverage drops below 70 %.
fail_under = 70